name: Context demo

on:
  workflow_dispatch:

env:
  APP_NAME: Netflix

jobs:
  info:
    runs-on: ubuntu-latest

    steps:
      - name: Print Repo
        run: echo "${{ github.repository }}"

      - name: Print User
        run: echo "${{ github.actor }}"

      - name: Print Branch
        run: echo "${{ github.ref }}"

      - name: Print Ref
        run: echo "${{ github.ref }}"

      - name: Print SHA
        run: echo "${{ github.sha }}"

      - name: Print Variable
        run: echo "${{ env.APP_NAME }}"

      - name: Print Secret
        run: echo "${{ secrets.API_KEY }}"

      - name: Print Runner OS
        run: echo "${{ runner.os }}"

      - name: This is the last point
        run: echo "This process is completed"
